<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swim &amp; Dry-Land 12-Week Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Pool deck: deep-water navy ink on cool tile, lane-rope accents. Layout: sticky tab rail, one working column, cards on a 12-col grid. */
  --bg: #eef3f5;
  --surface: #ffffff;
  --surface-2: #f5f9fa;
  --ink: #0e2433;
  --muted: #587080;
  --line: #d5e1e6;
  --accent: #0a7f99;
  --accent-soft: #dff1f5;
  --him: #0a7f99;
  --her: #d2573d;
  --her-soft: #fbe7e1;
  --good: #2f8a4c;
  --warn: #b7791f;
  --swim: #2563c9;
  --swim-soft: #e3ecfb;
  --fig: #0e2433;
  --hl: #e39a10;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1820; --surface: #102330; --surface-2: #0d1e29; --ink: #e4eff3; --muted: #8fa7b4; --line: #21394a;
    --accent: #3fc1da; --accent-soft: #123846; --him: #3fc1da; --her: #f08a70; --her-soft: #3a2018;
    --good: #5cc27b; --warn: #e3a84a; --swim: #7aa7f5; --swim-soft: #17294a; --fig: #e4eff3; --hl: #f5b941; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1820; --surface: #102330; --surface-2: #0d1e29; --ink: #e4eff3; --muted: #8fa7b4; --line: #21394a;
  --accent: #3fc1da; --accent-soft: #123846; --him: #3fc1da; --her: #f08a70; --her-soft: #3a2018;
  --good: #5cc27b; --warn: #e3a84a; --swim: #7aa7f5; --swim-soft: #17294a; --fig: #e4eff3; --hl: #f5b941; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
h1, h2, h3, h4 { font-family: var(--font-display); letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: 34px; font-weight: 700; }
h2 { font-size: 26px; font-weight: 700; }
h3 { font-size: 20px; font-weight: 600; }
h4 { font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

header.top { background: var(--ink); color: var(--bg); position: relative; }
header.top .wrap { padding: 20px 16px 16px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: end; justify-content: space-between; }
header.top h1 { color: var(--bg); }
header.top .sub { color: color-mix(in srgb, var(--bg) 75%, transparent); font-size: 14px; }
.lane { height: 6px; background: repeating-linear-gradient(90deg, var(--her) 0 18px, #f4f4f4 18px 30px, var(--accent) 30px 48px, #f4f4f4 48px 60px); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

nav.tabs { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { flex: none; padding: 12px 12px 10px; text-decoration: none; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs a:hover { color: var(--ink); }

main { padding: 24px 0 64px; }
section.view { display: none; }
section.view.on { display: grid; gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid3 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.between { justify-content: space-between; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.swim { background: var(--swim-soft); color: var(--swim); border-color: transparent; }
.chip.gym { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.rest { background: var(--surface-2); color: var(--muted); }
.chip.dl { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); border-color: transparent; }
.chip.him { color: var(--him); }
.chip.her { color: var(--her); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn.sm { padding: 4px 9px; font-size: 13px; }

/* Day view */
.dayhead { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.dayhead .when { display: grid; gap: 2px; }
.dayhead .when .date { font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1; }
.banner { background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 58px 14px 1fr; gap: 0 10px; }
.tl .t { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; padding-top: 10px; color: var(--muted); }
.tl .rail { position: relative; }
.tl .rail::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.tl .rail::after { content: ""; position: absolute; left: 1px; top: 14px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--muted); }
.tl.swim .rail::after { border-color: var(--swim); background: var(--swim); }
.tl.gym .rail::after { border-color: var(--accent); background: var(--accent); }
.tl .body { padding: 8px 0 14px; display: grid; gap: 6px; min-width: 0; }
.tl .label { font-weight: 600; }
.portion { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; font-size: 14px; align-items: baseline; }
.portion .who { font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.portion .who.a { color: var(--him); }
.portion .who.b { color: var(--her); }
.portion .k { color: var(--muted); font-size: 12px; white-space: nowrap; }
.swapline { font-size: 13px; color: var(--muted); }
.swapline button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: 13px; }
.ar { font-family: "IBM Plex Sans Arabic", var(--font-body); color: var(--muted); font-size: 13px; }

.macro { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.macro .m { border-radius: 8px; padding: 12px; background: var(--surface-2); display: grid; gap: 4px; }
.macro .m.a { border-left: 4px solid var(--him); }
.macro .m.b { border-left: 4px solid var(--her); }
.macro .big { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1; }

/* Sessions */
.part { display: grid; gap: 8px; }
.part-h { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.exrow { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 6px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; background: none; text-align: left; width: 100%; }
.exrow:hover { background: var(--surface-2); border-color: var(--line); }
.exrow .fig { width: 64px; height: 52px; }
.exrow .nm { font-weight: 600; }
.exrow .rx { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent); white-space: nowrap; text-align: right; }
.exrow .alt { font-size: 12px; color: var(--muted); }
.fig svg { width: 100%; height: 100%; display: block; }
.note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }
.blockpick { display: flex; flex-wrap: wrap; gap: 6px; }
.blockpick button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.blockpick button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Exercise library */
.excards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.excard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; cursor: pointer; text-align: left; align-content: start; color: var(--ink); }
.excard:hover { border-color: var(--accent); }
.excard .fig { height: 130px; background: var(--surface-2); border-radius: 8px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }

/* Schedule */
.sched { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-display); font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sched table { min-width: 860px; }
.sched td.cell { cursor: pointer; }
.sched td.cell:hover { background: var(--surface-2); }
.sched td.cell .d { font-size: 12px; color: var(--muted); }
.sched td.cell .s { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; margin-top: 3px; }
.sched tr.current td { background: var(--accent-soft); }
.sched tr.dl td:first-child { box-shadow: inset 4px 0 0 var(--warn); }
.wk { font-family: var(--font-display); font-size: 20px; font-weight: 700; }

/* Lists */
ul.clean { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
ul.clean li { padding-left: 16px; position: relative; }
ul.clean li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 4px 0; cursor: pointer; }
.check input { margin-top: 4px; accent-color: var(--accent); }
.check.done span { text-decoration: line-through; color: var(--muted); }
dl.kv { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 8px 16px; margin: 0; }
dl.kv dt { font-weight: 600; }
dl.kv dd { margin: 0; }

/* Progress */
.pstats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
.stat { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.stat .v { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--muted); }
.chart svg { width: 100%; height: auto; display: block; }
form.log { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); align-items: end; }
form.log label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
form.log input, form.log select, .names input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; width: 100%; color: var(--ink); }
.status { font-size: 13px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); }
.status.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); }
.status.good { background: color-mix(in srgb, var(--good) 15%, transparent); }
.advice { border-left: 4px solid var(--line); padding: 6px 12px; font-size: 14px; }
.advice.good { border-color: var(--good); }
.advice.warn { border-color: var(--warn); }
.logtable { overflow-x: auto; }
.logtable table { min-width: 560px; font-size: 14px; }

/* Modal */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(720px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(5, 15, 22, .55); }
.modal { display: grid; gap: 14px; padding: 20px; }
.modal .bigfig { background: var(--surface-2); border-radius: 10px; height: 240px; }
.modal ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }


.grid2.wide { grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); }

.exviz { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
.exviz .bigfig { height: 260px; }
.frames { display: grid; gap: 8px; }
.frames > div { display: grid; gap: 2px; }
.fig.still { height: 112px; background: var(--surface-2); border-radius: 8px; }
.targets { display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: start; }
.targets p { margin-bottom: 6px; }
.mmap { width: 100%; height: auto; }
.alts { display: grid; gap: 6px; }
.altrow { display: grid; grid-template-columns: 120px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.altrow .chip { justify-self: start; }
.segs { display: grid; gap: 4px; overflow-x: auto; }
.seg { display: grid; grid-template-columns: 104px 52px 64px 84px minmax(60px,1fr) 56px 30px; gap: 5px; align-items: center; min-width: 480px; }
.seg input, .seg select, #seg-text, .swwho input[type=text], .swwho input[type=number], .swwho select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 7px; color: var(--ink); min-width: 0; width: 100%; }
#seg-text { width: 100%; font-family: inherit; margin-bottom: 6px; }
.swtot { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; padding: 10px 12px; background: var(--swim-soft); border-radius: 8px; }
.swtot .big { font-family: var(--font-display); font-size: 30px; font-weight: 700; color: var(--swim); }
.swwho { display: grid; gap: 8px; background: var(--surface-2); padding: 10px; border-radius: 8px; }
.hbar { display: grid; grid-template-columns: 90px 1fr 60px; gap: 8px; align-items: center; font-size: 13px; padding: 2px 0; }
.hbar .bar { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.hbar .bar i { display: block; height: 100%; border-radius: 5px; }
table.ing td { padding: 5px 8px; font-size: 14px; }
table.ing td:last-child { text-align: right; color: var(--muted); }
.recipe ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.recipe.flash { box-shadow: 0 0 0 3px var(--accent); }
@media (max-width: 620px) { .exviz, .targets { grid-template-columns: 1fr; } .frames { grid-template-columns: 1fr 1fr; } .altrow { grid-template-columns: 1fr auto; } .altrow .chip { grid-column: 1 / -1; } }

/* v4: navigation */
.mainnav { display: flex; gap: 4px; }
.mainnav a { display: inline-flex; align-items: center; gap: 8px; padding: 12px 14px 10px; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; }
.mainnav a svg { width: 20px; height: 20px; }
.mainnav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.subnavbar { background: var(--surface-2); border-bottom: 1px solid var(--line); }
.subnav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-top: 6px; padding-bottom: 6px; }
.subnav a { flex: none; padding: 6px 12px; border-radius: 999px; text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 500; }
.subnav a[aria-current="page"] { background: var(--ink); color: var(--bg); }
@media (max-width: 700px) {
  nav.tabs { position: fixed; bottom: 0; top: auto; left: 0; right: 0; border-top: 1px solid var(--line); border-bottom: 0; padding-bottom: env(safe-area-inset-bottom); }
  .mainnav { justify-content: space-around; padding: 0; }
  .mainnav a { flex-direction: column; gap: 2px; font-size: 11px; padding: 8px 6px; border-bottom: 0; border-top: 3px solid transparent; }
  .mainnav a[aria-current="page"] { border-top-color: var(--accent); }
  .subnavbar { position: sticky; top: 0; z-index: 15; }
  header.top .wrap { padding: 14px 16px 10px; }
  header.top h1 { font-size: 22px; }
  header.top .sub { display: none; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: 14px; }
.btn.her { background: var(--her); color: var(--surface); border-color: var(--her); }
/* Today */
.mealrow { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 2px; cursor: pointer; color: var(--ink); font: inherit; }
.mealrow:hover { background: var(--surface-2); }
.mealrow .chev { font-size: 22px; color: var(--muted); }
dialog.sheet { width: min(640px, 100vw); max-height: 88dvh; }
.sheet-grab { display: none; }
.portion-card { border-left: 4px solid; background: var(--surface-2); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; }
.altmeals { display: grid; gap: 8px; margin-top: 8px; }
.altmeal { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
@media (max-width: 620px) {
  dialog.sheet { margin: auto 0 0; width: 100vw; max-width: 100vw; border-radius: 16px 16px 0 0; max-height: 90dvh; }
  dialog.sheet .modal { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
  .sheet-grab { display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: -6px auto 2px; }
}
.nextup { grid-template-columns: 1fr auto; align-items: center; border-left: 4px solid var(--accent); }
.sessparts { display: grid; gap: 8px; }
.spart { display: grid; gap: 4px; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; }
.spart-ex { line-height: 1.9; }
.altrow-in { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 4px; align-items: center; }
.altpill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px 2px 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.altpill em { font-style: normal; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.altpill em.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.altpill em.dl { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.altpill em.swim { background: var(--swim-soft); color: var(--swim); }
.altpill em.gym { background: var(--accent-soft); color: var(--accent); }
.sx { display: grid; grid-template-columns: 76px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.sx:first-child { border-top: 0; }
.sx-fig { border: 0; padding: 0; background: var(--surface); border-radius: 8px; cursor: pointer; }
.sx-fig .fig { width: 76px; height: 64px; }
.sx-body { display: grid; gap: 2px; min-width: 0; }
.sx-name { font-weight: 600; font-size: 15px; text-align: left; }
.sx-rx { color: var(--accent); white-space: nowrap; }
.spart-ex { line-height: 1.4; }
.wo-alts { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.warnline { border-left-color: var(--warn) !important; }
.cant { gap: 4px 14px; border-top: 1px dashed var(--line); padding-top: 8px; }
.mealrow.flex strong { color: var(--warn); }
.flexline { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.freeday, .flexbox { background: color-mix(in srgb, var(--warn) 10%, var(--surface)); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.review { border-left: 4px solid var(--good); }
.chip.free { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); border-color: transparent; }
.pd.free { background: var(--warn); }
.balance { font-size: 13px; padding: 8px 12px; border-radius: 8px; background: color-mix(in srgb, var(--warn) 9%, var(--surface)); }
.login { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 16px; }
.login-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; width: min(420px, 100%); display: grid; gap: 12px; }
.login-card form.inline input { flex: 1 1 200px; width: auto; min-width: 0; }
.viewbar { gap: 10px; padding: 12px 16px; position: relative; }
.seg-ctl { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 2px; gap: 2px; background: var(--surface-2); }
